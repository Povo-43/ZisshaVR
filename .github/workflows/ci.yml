name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (CI carries the build load)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Unit tests (protocol + math)
        run: ./gradlew :protocol:test :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APKs
        run: ./gradlew :app:assembleDebug :remote:assembleDebug --stacktrace

      - name: Upload app APK
        uses: actions/upload-artifact@v4
        with:
          name: ZisshaVR-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload remote APK
        uses: actions/upload-artifact@v4
        with:
          name: ZisshaVR-Remote-debug
          path: remote/build/outputs/apk/debug/*.apk
